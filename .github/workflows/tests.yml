name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[headless,model,test]"
      - run: python -m unittest discover -s tests -v
      - run: fall-detection status
      - run: fall-detection demo --frames 3 --output outputs/smoke.jsonl
      - run: python -m fall_detection.live_stress --frames 150 --people 4 --width 160 --height 120 --profile-latency
      - run: python -m fall_detection.temporal_benchmark --synthetic-fixture --iterations 5 --warmup 2
